<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1120 560' width='1120' height='560' role='img' aria-label='Criba de SLM: respuestas, trampas y velocidad de cada modelo'><rect width='1120' height='560' fill='#ffffff'/><text x='40.0' y='38.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='16' fill='#191919' text-anchor='start' font-weight='600'>¿Responde lo que sabe y se calla lo que no?</text><text x='40.0' y='60.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='start' font-weight='400'>Cada punto es un modelo: 15 preguntas de las guías y 5 preguntas trampa.</text><rect x='519.0' y='118.0' width='59.0' height='80.0' fill='#eef5fd' stroke='#257de0' stroke-opacity='0.35' stroke-dasharray='4 3' rx='6'/><line y1='470.0' y2='130.0' x1='96.0' x2='96.0' stroke='#e6e6e6'/><text x='96.0' y='490.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#666666' text-anchor='middle' font-weight='400'>0 %</text><line y1='470.0' y2='130.0' x1='213.5' x2='213.5' stroke='#e6e6e6'/><text x='213.5' y='490.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#666666' text-anchor='middle' font-weight='400'>25 %</text><line y1='470.0' y2='130.0' x1='331.0' x2='331.0' stroke='#e6e6e6'/><text x='331.0' y='490.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#666666' text-anchor='middle' font-weight='400'>50 %</text><line y1='470.0' y2='130.0' x1='448.5' x2='448.5' stroke='#e6e6e6'/><text x='448.5' y='490.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#666666' text-anchor='middle' font-weight='400'>75 %</text><line y1='470.0' y2='130.0' x1='566.0' x2='566.0' stroke='#e6e6e6'/><text x='566.0' y='490.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#666666' text-anchor='middle' font-weight='400'>100 %</text><line x1='96.0' x2='566.0' y1='402.0' y2='402.0' stroke='#e6e6e6'/><text x='86.0' y='406.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#666666' text-anchor='end' font-weight='400'>60 %</text><line x1='96.0' x2='566.0' y1='266.0' y2='266.0' stroke='#e6e6e6'/><text x='86.0' y='270.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#666666' text-anchor='end' font-weight='400'>80 %</text><line x1='96.0' x2='566.0' y1='130.0' y2='130.0' stroke='#e6e6e6'/><text x='86.0' y='134.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#666666' text-anchor='end' font-weight='400'>100 %</text><line x1='96.0' x2='566.0' y1='470.0' y2='470.0' stroke='#666666'/><text x='331.0' y='514.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='400'>Preguntas de las guías que responde (no dice «no lo sé») →</text><g transform='translate(50.0,300.0) rotate(-90)'><text x='0.0' y='0.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='400'>Trampas en las que no se inventa nada →</text></g><circle cx='566.0' cy='130.0' r='7' fill='#257de0' stroke='#ffffff' stroke-width='2'><title>qwen3.5:4b, ministral-3:3b: responde 100 %, no se inventa 100 %</title></circle><text x='579.0' y='126.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='start' font-weight='600'>qwen3.5:4b</text><text x='579.0' y='142.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='start' font-weight='600'>ministral-3:3b</text><circle cx='472.0' cy='130.0' r='7' fill='#257de0' stroke='#ffffff' stroke-width='2'><title>gemma4:e2b: responde 80 %, no se inventa 100 %</title></circle><text x='459.0' y='134.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='end' font-weight='600'>gemma4:e2b</text><circle cx='566.0' cy='266.0' r='7' fill='#257de0' stroke='#ffffff' stroke-width='2'><title>granite4:3b: responde 100 %, no